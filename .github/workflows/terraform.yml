name: vm_tf_code

on: 
  push:
    branches:
      - master
  workflow_dispatch: 

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
        - name: checkout code
          uses: actions/checkout@v4

        - name: Azure Login
          uses: azure/login@v2
          with:
            creds: ${{ secrets.AZURE_CREDENTIALS }}

        - name: Install Terraform
          uses: hashicorp/setup-terraform@v3

        - name: Create tfvars file from secret
          run: echo '${{ secrets.TF_VARS }}' > terraform.tfvars.json

        - name: Terraform Init
          run: terraform init

        - name: Terraform Plan
          run: terraform plan

        - name: Terraform Apply
          run: terraform apply -auto-approve
